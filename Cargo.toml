# Sift workspace.
#
# The single front end is the Tauri v2 + Svelte application in src-tauri/.
# Dependencies point downward only:
#   src-tauri -> sift-monitor -> sift-analyze -> sift-scan -> sift-platform / sift-core
#                                sift-store
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/sift-core",
    "crates/sift-platform",
    "crates/sift-scan",
    "crates/sift-analyze",
    "crates/sift-store",
    "crates/sift-monitor",
    "crates/sift-persist",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Sift"]

[workspace.dependencies]
sift-core = { path = "crates/sift-core" }
sift-platform = { path = "crates/sift-platform" }
sift-scan = { path = "crates/sift-scan" }
sift-analyze = { path = "crates/sift-analyze" }
sift-store = { path = "crates/sift-store" }
sift-monitor = { path = "crates/sift-monitor" }
sift-persist = { path = "crates/sift-persist" }

# Domain / engine dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
trash = "5"
notify = "7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The scan engine is benchmarked in release-like conditions without paying
# whole-program LTO on every iteration.
[profile.bench-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
strip = false
