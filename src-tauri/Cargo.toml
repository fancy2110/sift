[package]
name = "sift"
description = "Sift — AI-native disk space manager (Tauri front end)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shared core: the same crates the native GPUI front end uses.
sift-core = { workspace = true }
sift-platform = { workspace = true }
sift-scan = { workspace = true }
sift-analyze = { workspace = true }
sift-store = { workspace = true }
sift-monitor = { workspace = true }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"

[features]
default = ["remote-ai"]
# Forwards the optional remote-adjudicator support in `sift-analyze`. Off means
# the front end only ever uses local rules.
remote-ai = ["sift-analyze/remote-ai"]
