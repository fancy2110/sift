<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!--
    SIFT macOS menu-bar template glyph. Solid-black alpha mask; macOS tints it
    for light/dark menu bars. Bold sunburst of six disk-usage wedges + hub,
    with the top "reclaim" wedge pulled out (same gesture as the app icon).

    The artwork below is the original 256-canvas drawing (intrinsic bbox
    x 32..223, y 22..223). The wrapper group scales it ~1.18x to fill the
    canvas and dilates the alpha by 2 user units, matching the shipped
    icons/tray-template.png: glyph bbox ~(5,3)-(122,123) at 128 px and ~61%
    ink coverage. Those raster-only adjustments were made in
    b08cc4b ("fill the canvas") and 7a03e74 ("fill the canvas and bolden the
    glyph"); keep this vector source in sync when touching the tray icon.
    Render at 128 px to regenerate icons/tray-template.png.
  -->
  <defs>
    <filter id="bolden" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="2"/>
    </filter>
  </defs>
  <g fill="#000000" filter="url(#bolden)" transform="translate(-22.84 -17.94) scale(1.1791)">
    <g>
    <path d="M214.3 85.9 A96 96 0 0 1 214.3 170.1 L167.5 147.3 A44 44 0 0 0 167.5 108.7 Z"/>
    <path d="M207.6 181.7 A96 96 0 0 1 134.7 223.8 L131.1 171.9 A44 44 0 0 0 164.5 152.6 Z"/>
    <path d="M121.3 223.8 A96 96 0 0 1 48.4 181.7 L91.5 152.6 A44 44 0 0 0 124.9 171.9 Z"/>
    <path d="M41.7 170.1 A96 96 0 0 1 41.7 85.9 L88.5 108.7 A44 44 0 0 0 88.5 147.3 Z"/>
    <path d="M48.4 74.3 A96 96 0 0 1 121.3 32.2 L124.9 84.1 A44 44 0 0 0 91.5 103.4 Z"/>
    <!-- hub -->
    <circle cx="128" cy="128" r="42"/>
    <!-- top wedge pulled outward by 10 -->
    <path d="M134.7 22.2 A96 96 0 0 1 207.6 64.3 L164.5 93.4 A44 44 0 0 0 131.1 74.1 Z"/>
    </g>
  </g>
</svg>
