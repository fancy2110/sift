<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS continuous-corner approximation -->
    <path id="squircle" d="M512 6
      C838 6 1018 186 1018 512
      C1018 838 838 1018 512 1018
      C186 1018 6 838 6 512
      C6 186 186 6 512 6 Z"/>
    <clipPath id="iconClip"><use href="#squircle"/></clipPath>

    <linearGradient id="bgGrad" x1="140" y1="60" x2="880" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#211f2e"/>
      <stop offset="0.55" stop-color="#16151e"/>
      <stop offset="1" stop-color="#0f0e15"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(790 190) rotate(132) scale(560)">
      <stop offset="0" stop-color="#7c5cf0" stop-opacity="0.34" />
      <stop offset="1" stop-color="#7c5cf0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(230 880) rotate(-52) scale(520)">
      <stop offset="0" stop-color="#3b7be8" stop-opacity="0.22" />
      <stop offset="1" stop-color="#3b7be8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gBlue" x1="0" y1="0" x2="360" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f97f2" />
      <stop offset="1" stop-color="#3a63d0" />
    </linearGradient>
    <linearGradient id="gViolet" x1="360" y1="0" x2="1024" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b46ee0" />
      <stop offset="1" stop-color="#8344c4" />
    </linearGradient>
    <linearGradient id="gTeal" x1="360" y1="300" x2="692" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58c3d4" />
      <stop offset="1" stop-color="#2a93ac" />
    </linearGradient>
    <linearGradient id="gIndigo" x1="692" y1="300" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a82f0" />
      <stop offset="1" stop-color="#6550d6" />
    </linearGradient>

    <linearGradient id="sheen" x1="512" y1="0" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.025" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Treemap blocks: edge to edge, no gaps, no background fill -->
    <rect x="0" y="0" width="360" height="1024" fill="url(#gBlue)" />
    <rect x="360" y="0" width="664" height="300" fill="url(#gViolet)" />
    <rect x="360" y="300" width="332" height="724" fill="url(#gTeal)" />
    <rect x="692" y="300" width="332" height="724" fill="url(#gIndigo)" />

    <!-- AI sparkle on the main block -->
    <path d="M180 440
      C186 486 206 506 252 512
      C206 518 186 538 180 584
      C174 538 154 518 108 512
      C154 506 174 486 180 440 Z"
      fill="#ffffff" fill-opacity="0.92" />

    <!-- top sheen across the whole icon -->
    <rect width="1024" height="1024" fill="url(#sheen)" />
  </g>

  <!-- crisp edge: hairline inner stroke following the squircle -->
  <use href="#squircle" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" />
</svg>
</body>
</html>
